name: artemis
version: 7.13.3

description: Build dart types from GraphQL schemas and queries (using Introspection Query).
homepage: https://github.com/comigor/artemis

environment:
  sdk: ^3.9.0

dependencies:
  build_config: ^1.1.1
  code_builder: ^4.4.0
  build: ^4.0.0
  collection: ^1.17.1
  dart_style: ^3.1.0
  equatable: ^2.0.5
  glob: ^2.1.1
  gql_code_builder: ^0.15.1
  gql_dedupe_link: ^4.0.0
  gql_exec: ^1.0.0
  gql_http_link: ^1.2.0
  gql_link: ^1.1.0
  gql: ^1.0.1
  http: ^0.13.5
  json_annotation: ^4.8.0
  path: ^1.8.3
  recase: ^4.1.0
  source_gen: ^4.2.0
  yaml: ^3.1.1

dev_dependencies:
  args: ^2.4.0
  build_runner: ^2.7.2
  build_test: ^3.5.10
  json_serializable: ^6.6.1
  test: ^1.22.2
  logging: ^1.1.1
  lints: ^2.0.1
